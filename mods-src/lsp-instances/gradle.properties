# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx1G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# https://github.com/neoforged/ModDevGradle?tab=readme-ov-file#better-minecraft-parameter-names--javadoc-parchment
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

# Environment: must match pack/pack.toml
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.252
loader_version_range=[1,)

## Mod Properties
mod_id=lsp_instances
mod_name=LemurSaucePacket Instances
mod_license=MIT
mod_version=1.1.0
mod_group_id=net.lemursaucepacket.instances
mod_authors=LemurSaucePacket
mod_description=Instanced events: an NPC opens an event's window, players start it alone or open a co-op fight others join from the same window, and the party gets its own copy of the arena (a slot in an empty dimension, rebuilt from a template each run) with its boss. Deaths inside send the player's things to that NPC to collect (nothing drops, nothing goes into a grave). Events are data: data/<namespace>/lsp_instances/event/<name>.json.
