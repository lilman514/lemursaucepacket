# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx1G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# https://github.com/neoforged/ModDevGradle?tab=readme-ov-file#better-minecraft-parameter-names--javadoc-parchment
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

# Environment: must match pack/pack.toml
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.252
loader_version_range=[1,)

# Project MMO build the mixins are written against (compile-only, never bundled). Same file as
# pack/mods/project-mmo.pw.toml: Modrinth project KFQYC1Uy, version 9lu4zNd1 = pmmo-1.21.1-2.10.47.jar.
pmmo_modrinth_version=9lu4zNd1

# Mods the lifesteal code compiles against (compile-only, never bundled), same files as pack/mods/*.pw.toml:
# GraveStone Mod RYtXKJPr, Sophisticated Backpacks TyCTlI4b, Sophisticated Core nmoqTijg, Curios vvuO3ImH.
gravestone_modrinth_version=rMGJpjaM
sophisticatedbackpacks_modrinth_version=tDbXyZq4
sophisticatedcore_modrinth_version=blXGSmAb
curios_modrinth_version=yohfFbgD

## Mod Properties
mod_id=lsp_fixes
mod_name=LemurSaucePacket Fixes
mod_license=MIT
mod_version=1.5.1
mod_group_id=net.lemursaucepacket.fixes
mod_authors=LemurSaucePacket
mod_description=The LemurSaucePacket modpack's own Java: Project MMO skills-panel fixes, the Hardness use-gate (materials you can't mine yet can't go into recipes, machines or non-chest containers), the parts of the hearts, graves and elimination system that KubeJS can't do (graves need Grave Essence, eliminated players confirm on the death screen, their blocks and items are erased, the lost-item compasses), and the HUD layout editor (Esc > HUD Layout, /hudlayout) that moves other mods' HUD parts and saves them in each mod's own config.
