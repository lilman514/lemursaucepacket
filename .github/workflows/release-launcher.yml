# Builds the Windows installer and publishes it to GitHub Releases, where installed launchers
# find it and update themselves. Needs brand.json → updates.owner/repo set to this (public) repo.
#
# Release: bump "version" in launcher/package.json, commit, then
#   git tag launcher-v0.1.1 && git push origin launcher-v0.1.1
name: Release launcher

on:
  push:
    tags: ['launcher-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: launcher
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: launcher/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
