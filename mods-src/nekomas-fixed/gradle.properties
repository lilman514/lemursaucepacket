# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx1G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# https://github.com/neoforged/ModDevGradle?tab=readme-ov-file#better-minecraft-parameter-names--javadoc-parchment
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

# Environment: must match pack/pack.toml
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.252
loader_version_range=[1,)

# JEI, for the kiln's recipe category (compile-only, never bundled). Same file as pack/mods/jei.pw.toml:
# Modrinth project u6dRKJwZ, version ufHUqt9b = jei-1.21.1-neoforge-19.51.0.418.jar.
jei_modrinth_version=ufHUqt9b

## Mod Properties
# The mod id and namespace stay upstream's ("nekomasfixed") so its assets and data work unchanged.
mod_id=nekomasfixed
mod_name=Nekoma's Fixed (LemurSaucePacket port)
mod_license=MIT
# Upstream 0.5.2 (its Fabric 1.21.1 branch), our port build 1.
mod_version=0.5.2+lsp.1
mod_group_id=net.lemursaucepacket.nekomasfixed
mod_authors=GreenJAB (Nekoma's Fixed), Strikey5852 (its 1.21.1 branch), LemurSaucePacket (NeoForge port)
mod_credits=Nekoma's Fixed is by GreenJAB, built on the ideas of YouTuber Nekoma, with developers CyberMODDER, Gear, Akshaj and engholm and textures by velocyblue. The Fabric 1.21.1 branch this port starts from is by Strikey5852. Ported to NeoForge for the LemurSaucePacket modpack. MIT licensed.
mod_description=A NeoForge port of the first batch of Nekoma's Fixed for the LemurSaucePacket modpack: four new dyes (amber, aqua, indigo, maroon) with their wool, carpet, terracotta, glazed terracotta, concrete, concrete powder, stained glass, panes, candles, beds and shulker boxes; dyed bricks, slabs, stairs and walls in all 20 colours; froglights in every colour; the Glow Torch that burns under water; the Redstone Striker; the vanilla clock placed on floors and walls (with its time label, alarm bell and recorded time); and the kiln, a fast furnace for building blocks.
